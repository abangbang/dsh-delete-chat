name: ci

# The plugin touches the filesystem, path derivation and process locking — the
# three places Windows and POSIX diverge — so the suite runs on all three OSes
# that DSH ships to. Windows and POSIX branches inside test/platform.test.mjs are
# mutually exclusive by design: a green run on one OS never stands in for another.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no runtime dependencies, so there is nothing to install.
      - name: Test
        run: npm test

      - name: Validate the market index
        run: node scripts/check-market-index.mjs

      - name: Parse install.sh
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: Parse install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'install.ps1 parses'
